[package]
name = "stereo3d"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = { optional = true, version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = "0.25.10"
nalgebra = { version = "0.35.0", features = ["serde-serialize"] }
rayon = "1.12.0"
rfd = { version = "0.18.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd"]

[[bin]]
name = "stereo3d"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "stereo3d-cli"
path = "src/bin/cli.rs"

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 2
