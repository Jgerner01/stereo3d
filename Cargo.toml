[package]
name = "stereo3d"
version = "0.2.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
eframe = { optional = true, version = "0.37.0", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
image = "0.25.10"
nalgebra = { version = "0.35.0", features = ["serde-serialize"] }
rayon = "1.12.0"
rfd = { version = "0.18.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
# Update-Funktion der Oberfläche
serde_json = { version = "1", optional = true }
sha2 = { version = "0.11", optional = true }
ureq = { version = "3", optional = true }
zip = { version = "9", default-features = false, features = ["deflate"], optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:serde_json", "dep:sha2", "dep:ureq", "dep:zip"]

[[bin]]
name = "stereo3d"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "stereo3d-cli"
path = "src/bin/cli.rs"

[profile.release]
opt-level = 3
debug = false

[profile.dev]
opt-level = 2
